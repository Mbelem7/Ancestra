{% extends "layout.html" %}

{% block title %}
<title>Galería - Ancestra</title>
{% endblock %}

{% block body %}
<div class="container content">
    
    <!-- BARRA SUPERIOR: Regresar (Izquierda) y Crear (Derecha) -->
        <div class="barra-superior-galeria">
        
        <!-- Botón Regresar (Oculto en la pantalla principal) -->
            <div id="btn-regresar-container" style="visibility: hidden;">
            <button class="btn-cancelar" id="btn-regresar-accion" onclick="volverAAlbumes()" style="border-radius: 50px;">
                ←
            </button>
            </div>

        <!-- Botón de admin para crear imagen -->
        <div>
            <!-- {# {% if current_user.is_admin %} #} -->
            <a href="/crear-imagen" class="btn-crear-admin" style="margin: 0; display: inline-block;">
                + Nueva Imagen
            </a>
            <!-- {# {% endif %} #} -->
            </div>
        </div>

    <!-- ==========================================
         VISTA 1: ÁLBUMES (COLLAGE)
         ========================================== -->
    <div id="vista-albumes">
        <h2 class="titulo-seccion mb-4">Galería de Álbumes</h2>
        
        <div class="albumes-container">
            <div class="album-card" onclick="abrirCuadricula('Lugares típicos')">
                <div class="collage-grid">
                    <div class="collage-item grande"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
                    <div class="collage-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
                    <div class="collage-item vertical"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
                </div>
                <p class="album-titulo">Lugares típicos</p>
            </div>

            <div class="album-card" onclick="abrirCuadricula('Tradiciones')">
                <div class="collage-grid">
                    <div class="collage-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
                    <div class="collage-item grande"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
                    <div class="collage-item"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
                </div>
                <p class="album-titulo">Tradiciones</p>
            </div>

            <div class="album-card" onclick="abrirCuadricula('Otros')">
                <div class="collage-grid">
                    <div class="collage-item vertical"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
                    <div class="collage-item grande"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
                </div>
                <p class="album-titulo">Otros</p>
            </div>
        </div>
    </div>

    <!-- ==========================================
         VISTA 2: CUADRÍCULA DEL ÁLBUM
         ========================================== -->
    <div id="vista-cuadricula" style="display: none;">
        <h2 class="titulo-seccion mb-4" id="titulo-cuadricula">Álbum</h2>
        <div class="galeria-grid">
            <div class="galeria-item" onclick="abrirCarrusel()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
            <div class="galeria-item" onclick="abrirCarrusel()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
            <div class="galeria-item" onclick="abrirCarrusel()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
            <div class="galeria-item" onclick="abrirCarrusel()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
            <div class="galeria-item" onclick="abrirCarrusel()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
            <div class="galeria-item" onclick="abrirCarrusel()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
        </div>
    </div>

    <!-- ==========================================
         VISTA 3: CARRUSEL ENFOCADO
         ========================================== -->
    <div id="vista-carrusel" style="display: none;">
        <div class="carrusel-container">
            <div class="carrusel-item lateral"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
            <div class="carrusel-item central"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
            <div class="carrusel-item lateral"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle></svg></div>
        </div>
    </div>


<!-- Funciones dinámicas para cambiar vistas y botones -->
<script>
    function abrirCuadricula(nombreAlbum) {
        document.getElementById('vista-albumes').style.display = 'none';
        document.getElementById('vista-cuadricula').style.display = 'block';
        document.getElementById('titulo-cuadricula').innerText = nombreAlbum;
        
        // Muestra el botón de regresar y le dice que vuelva a los álbumes
        document.getElementById('btn-regresar-container').style.visibility = 'visible';
        let btnRegresar = document.getElementById('btn-regresar-accion');
        btnRegresar.setAttribute('onclick', 'volverAAlbumes()');
        btnRegresar.innerText = '←';
    }

    function volverAAlbumes() {
        document.getElementById('vista-cuadricula').style.display = 'none';
        document.getElementById('vista-albumes').style.display = 'block';
        
        // Oculta el botón porque ya estamos en el inicio
        document.getElementById('btn-regresar-container').style.visibility = 'hidden';
    }

    function abrirCarrusel() {
        document.getElementById('vista-cuadricula').style.display = 'none';
        document.getElementById('vista-carrusel').style.display = 'block';
        
        // Cambia el botón para que ahora regrese a la cuadrícula
        let btnRegresar = document.getElementById('btn-regresar-accion');
        btnRegresar.setAttribute('onclick', 'volverACuadricula()');
        btnRegresar.innerText = '←';
    }

    function volverACuadricula() {
        document.getElementById('vista-carrusel').style.display = 'none';
        document.getElementById('vista-cuadricula').style.display = 'block';
        
        // Restaura el botón para que vuelva a álbumes
        let btnRegresar = document.getElementById('btn-regresar-accion');
        btnRegresar.setAttribute('onclick', 'volverAAlbumes()');
        btnRegresar.innerText = '←';
    }
</script>
{% endblock %}
