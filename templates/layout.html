<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANCESTRA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">

    {% block title %} {% endblock %}
    {% block css %} {% endblock %}
</head>
<body>
    <!-- NAVBAR-->
<header class="header {% block clase_header %}{% endblock %}"> 
    <div class="header__pattern header__pattern--left"></div>
    
    <h1 class="header__title">
        {% block titulo_header %}Ancestra{% endblock %}
    </h1>

    <div class="header__pattern header__pattern--right"></div>
</header>

<div class="content">
    <nav class="navbar"> 
        <a href="{{ url_for('index') }}" class="nav__item {{ 'nav__item--active' if request.endpoint == 'index' else '' }}">Home</a>
        <a href="{{ url_for('biblioteca') }}" class="nav__item {{ 'nav__item--active' if request.endpoint == 'biblioteca' else '' }}">Biblioteca</a>
        <a href="{{ url_for('galeria') }}" class="nav__item {{ 'nav__item--active' if request.endpoint == 'galeria' else '' }}">Galería</a>
        <a href="{{ url_for('mapa') }}" class="nav__item {{ 'nav__item--active' if request.endpoint == 'mapa' else '' }}">Mapa</a>
        
        <!-- Usamos .startswith() para que 'crear-local' o 'crear-plantilla' mantengan este botón activo -->
        <a href="{{ url_for('crear') }}" class="nav__item {{ 'nav__item--active' if request.endpoint and request.endpoint.startswith('crear') else '' }}">Crear</a>

        <form class="nav__search" role="search">
            <input type="search" placeholder="Buscar..." aria-label="Buscar">
            <button type="submit" aria-label="Buscar">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <circle cx="10" cy="10" r="7" fill="none" stroke="#5a7a1e" stroke-width="2"/>
                    <line x1="15" y1="15" x2="21" y2="21" stroke="#5a7a1e" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </form>
        <button id="btn-dark-mode" class="nav__item" style="cursor: pointer; background: none; border: none; font-size: 1.2rem;">
            🌙
        </button>
    </nav>
</div>

    <script>
    const toggleBtn = document.getElementById('btn-dark-mode');
    const body = document.body;
    
    // Revisar si el usuario ya tenía el modo oscuro activado antes
    if (localStorage.getItem('darkMode') === 'enabled') {
        body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️'; // Cambia el ícono a un sol
    }

    toggleBtn.addEventListener('click', () => {
        body.classList.toggle('dark-mode');
        
        // Guardar la preferencia y cambiar el ícono
        if (body.classList.contains('dark-mode')) {
            localStorage.setItem('darkMode', 'enabled');
            toggleBtn.textContent = '☀️';
        } else {
            localStorage.setItem('darkMode', 'disabled');
            toggleBtn.textContent = '🌙';
        }
    });
</script>
    {% block body %}
    {% endblock %}

    {% block js %}
    {% endblock %}
</body>
</html>
